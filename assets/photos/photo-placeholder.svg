<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Decorative photo placeholder">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a3b"/>
      <stop offset=".55" stop-color="#251b4c"/>
      <stop offset="1" stop-color="#070914"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#e8c268" stop-opacity=".42"/>
      <stop offset="1" stop-color="#e8c268" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset=".5" stop-color="#e8c268" stop-opacity=".75"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <ellipse cx="600" cy="370" rx="470" ry="340" fill="url(#glow)"/>
  <circle cx="170" cy="150" r="3" fill="#fff0c2" opacity=".8"/>
  <circle cx="315" cy="245" r="2" fill="#fff0c2" opacity=".7"/>
  <circle cx="930" cy="160" r="3" fill="#fff0c2" opacity=".8"/>
  <circle cx="1050" cy="300" r="2" fill="#fff0c2" opacity=".65"/>
  <circle cx="760" cy="100" r="2" fill="#fff0c2" opacity=".6"/>
  <path d="M0 620 Q260 540 500 635 T950 600 T1200 620 V800 H0Z" fill="#090d1d" opacity=".8"/>
  <path d="M0 650 Q300 590 600 655 T1200 635" fill="none" stroke="url(#horizon)" stroke-width="2"/>
  <rect x="34" y="34" width="1132" height="732" rx="24" fill="none" stroke="#e8c268" stroke-opacity=".38" stroke-width="2"/>
  <g fill="#f7f1e3" text-anchor="middle" font-family="Georgia,serif">
    <text x="600" y="386" font-size="54" letter-spacing="4">YOUR PHOTO GOES HERE</text>
    <text x="600" y="440" font-size="24" fill="#e8c268" letter-spacing="2">ADD AN IMAGE IN js/content.js</text>
  </g>
</svg>
